<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lily · 學員追蹤戰情室</title>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --h: 58px; --tab: 46px;
  --bg:       #f5f7fa;
  --bg2:      #ffffff;
  --bg3:      #f0f4f8;
  --surface:  #e8edf3;
  --surface2: #dce3eb;
  --border:   #e2e8f0;
  --border2:  #c8d3de;
  --accent:   #0ea5e9;
  --accent-d: #0284c7;
  --accent-l: #e0f2fe;
  --gold:     #d97706;
  --danger:   #ef4444;
  --success:  #10b981;
  --text:     #1e293b;
  --text2:    #475569;
  --text3:    #94a3b8;
  --radius:   14px;
  --radius-sm:8px;
  --shadow:   0 1px 4px rgba(15,23,42,0.06), 0 4px 16px rgba(15,23,42,0.06);
  --shadow-md:0 4px 24px rgba(15,23,42,0.10);
  --shadow-lg:0 12px 48px rgba(15,23,42,0.15);
  --font-en:  'DM Sans', sans-serif;
  --font-tc:  'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font-tc); font-size: 14px; line-height: 1.6; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }

/* ─── HEADER ─── */
header {
  height: var(--h); background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; position: relative; z-index: 20;
  box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(15,23,42,0.04);
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo .logo-mark {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-d) 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(14,165,233,0.35);
}
.header-logo .logo-mark svg { width: 16px; height: 16px; fill: white; }
.header-logo h2 { font-family: var(--font-en); font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
.header-logo h2 span { color: var(--accent); }
.header-date { font-family: var(--font-en); font-size: 12px; color: var(--text3); }

/* ─── TABS ─── */
.nav-tabs {
  display: flex; height: var(--tab); background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; gap: 2px;
}
.tab-item {
  display: flex; align-items: center; gap: 7px;
  padding: 0 20px; cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--text3);
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
.tab-item svg { width: 14px; height: 14px; }
.tab-item.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-item:hover:not(.active) { color: var(--text2); }

/* ─── PAGES ─── */
.page-content {
  display: none; height: calc(100vh - var(--h) - var(--tab)); width: 100vw;
}
.page-content.active { display: flex; }

/* ─── CALENDAR ─── */
.calendar-wrapper {
  flex: 1.6; background: var(--bg2); padding: 18px;
  border-right: 1px solid var(--border); overflow-y: auto; min-width: 0;
}
#calendar { height: 100%; min-height: 640px; }
.fc .fc-toolbar-title { font-family: var(--font-en); font-size: 16px !important; font-weight: 700; color: var(--text) !important; }
.fc .fc-button {
  background: var(--bg3) !important; border: 1px solid var(--border) !important;
  color: var(--text2) !important; border-radius: var(--radius-sm) !important;
  font-size: 12px !important; padding: 5px 10px !important;
  box-shadow: none !important;
}
.fc .fc-button:hover { background: var(--surface2) !important; color: var(--accent) !important; }
.fc .fc-button-primary:not(:disabled).fc-button-active { background: var(--accent-l) !important; color: var(--accent-d) !important; border-color: var(--accent) !important; }
.fc .fc-col-header-cell-cushion { font-family: var(--font-en); font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.7px; text-decoration: none !important; }
.fc .fc-daygrid-day-number { font-family: var(--font-en); font-size: 12px; color: var(--text3); text-decoration: none !important; }
.fc .fc-daygrid-day.fc-day-today { background: var(--accent-l) !important; }
.fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number { color: var(--accent-d); font-weight: 700; }
.fc .fc-daygrid-day { min-height: 95px !important; }
.fc .fc-event { border-radius: 5px !important; border: none !important; font-size: 11px !important; font-weight: 600; padding: 2px 5px !important; }
.fc-theme-standard td, .fc-theme-standard th { border-color: var(--border) !important; }
.fc-scrollgrid { border-color: var(--border) !important; }

/* ─── BOARD ─── */
.board-wrapper {
  flex: 1; padding: 16px; background: var(--bg);
  overflow-x: auto; display: flex; flex-direction: column; min-width: 0;
}
.board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.board-header h3 { font-size: 11px; font-weight: 700; color: var(--text3); font-family: var(--font-en); letter-spacing: 0.8px; text-transform: uppercase; }
.board-columns { display: flex; gap: 10px; flex: 1; overflow-x: auto; padding-bottom: 6px; }

.column {
  flex: 0 0 188px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; flex-direction: column; max-height: 100%;
  box-shadow: var(--shadow);
}
.column-header {
  padding: 10px 12px; border-radius: var(--radius) var(--radius) 0 0;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.col-title { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 7px; color: var(--text); }
.col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.col-count { font-size: 11px; color: var(--text3); font-family: var(--font-en); background: var(--bg3); padding: 1px 7px; border-radius: 99px; }
.list-area { flex: 1; padding: 8px; overflow-y: auto; }

.card {
  background: var(--bg2); padding: 11px 12px; margin-bottom: 7px;
  border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  box-shadow: 0 1px 3px rgba(15,23,42,0.04);
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border2); }
.card-name { font-weight: 700; font-size: 13px; color: var(--text); }
.card-time { font-family: var(--font-en); font-size: 10px; color: var(--text3); margin-top: 4px; display: block; }
.card-plan { font-size: 10px; font-weight: 700; color: var(--gold); display: block; margin-top: 3px; }

/* ─── LIST PAGE ─── */
.list-page {
  flex-direction: column; padding: 20px;
  overflow: hidden; background: var(--bg); gap: 14px;
}
.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.search-wrap { position: relative; }
.search-wrap input {
  background: var(--bg2); border: 1px solid var(--border); color: var(--text);
  padding: 9px 14px 9px 36px; border-radius: var(--radius-sm);
  font-size: 13px; width: 240px; outline: none; transition: border-color 0.2s;
  box-shadow: var(--shadow);
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-l); }
.search-wrap input::placeholder { color: var(--text3); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; }

.table-wrap { overflow: auto; flex: 1; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg2); box-shadow: var(--shadow); }
.excel-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.excel-table th {
  background: var(--bg3); padding: 10px 14px;
  border-bottom: 1px solid var(--border2);
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.5px;
  position: sticky; top: 0; z-index: 2; text-align: left;
}
.excel-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text2); }
.excel-table tbody tr:last-child td { border-bottom: none; }
.excel-table tbody tr:hover td { background: var(--accent-l); cursor: pointer; }
.status-pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; }

/* ─── SALES PAGE ─── */
.sales-page { flex-direction: column; padding: 22px; overflow-y: auto; background: var(--bg); gap: 18px; }
.sales-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.stat-card {
  background: var(--bg2); padding: 20px 22px;
  border-radius: var(--radius); border: 1px solid var(--border);
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.stat-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-d));
}
.stat-card .label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-family: var(--font-en); font-size: 28px; font-weight: 700; color: var(--text); margin: 8px 0 2px; }
.stat-card .sub { font-size: 12px; color: var(--text3); }
.progress-container { background: var(--bg3); border-radius: 99px; height: 6px; margin-top: 10px; overflow: hidden; }
.progress-bar { background: linear-gradient(90deg, var(--accent), var(--accent-d)); height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1); }

.sales-detail-card {
  background: var(--bg2); padding: 18px 20px;
  border-radius: var(--radius); border: 1px solid var(--border);
  box-shadow: var(--shadow); flex: 1;
}
.sales-detail-card h3 { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: none; padding: 8px 16px; border-radius: var(--radius-sm);
  cursor: pointer; font-weight: 600; font-size: 13px; font-family: var(--font-tc);
  transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: white; box-shadow: 0 2px 8px rgba(14,165,233,0.3); }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(14,165,233,0.4); }
.btn-success { background: var(--success); color: white; }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 6px 12px; font-size: 12px; }

/* ─── CONTEXT MENU ─── */
.context-menu {
  position: fixed; background: var(--bg2); border-radius: 10px;
  z-index: 6000; display: none;
  box-shadow: var(--shadow-lg); border: 1px solid var(--border);
  overflow: hidden; min-width: 145px;
}
.context-menu div { padding: 10px 16px; cursor: pointer; font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
.context-menu div:hover { background: var(--bg3); color: var(--text); }
.context-menu .danger:hover { background: #fef2f2; color: var(--danger); }
.context-menu hr { border: none; border-top: 1px solid var(--border); margin: 2px 0; }

/* ─── OVERLAY ─── */
.overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,0.4);
  z-index: 3000; display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
}
.overlay.show { display: flex; }

/* ─── MODAL ─── */
.modal {
  background: var(--bg2); padding: 26px 28px;
  border-radius: 18px; width: 420px; max-width: 95vw;
  border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  animation: modalIn 0.22s cubic-bezier(0.34,1.2,0.64,1);
  max-height: 90vh; overflow-y: auto;
}
@keyframes modalIn { from { opacity:0; transform: translateY(18px) scale(0.97); } to { opacity:1; transform: none; } }
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 18px; display: flex; align-items: center; gap: 9px; }
.modal-title .accent-chip { background: var(--accent-l); color: var(--accent-d); font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 9px 12px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 13px; font-family: var(--font-tc); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent); background: var(--bg2); box-shadow: 0 0 0 3px var(--accent-l);
}
.form-row { display: flex; gap: 8px; }
.form-row > * { flex: 1; min-width: 0; }

/* ─── 成交方案區塊 ─── */
#planSection {
  background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
  border: 1px solid #bae6fd;
  border-radius: var(--radius-sm); padding: 14px; margin-bottom: 14px;
}
#planSection .plan-label {
  font-size: 12px; font-weight: 700; color: var(--accent-d);
  display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
}
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.plan-btn {
  padding: 9px 10px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border2); background: var(--bg2);
  cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s;
  font-family: var(--font-tc);
}
.plan-btn:hover { border-color: var(--accent); background: var(--accent-l); }
.plan-btn.selected { border-color: var(--accent); background: var(--accent-l); box-shadow: 0 0 0 2px rgba(14,165,233,0.2); }
.plan-btn .plan-name { font-size: 12px; font-weight: 700; color: var(--text); display: block; }
.plan-btn .plan-price { font-size: 11px; color: var(--accent-d); font-family: var(--font-en); display: block; margin-top: 2px; }

/* 自訂課程卡 */
.plan-btn.custom-btn { grid-column: 1 / -1; }
.plan-btn.custom-btn .plan-name { color: var(--gold); }
.plan-btn.custom-btn .plan-price { color: var(--text3); }
.custom-amount-row {
  display: none; gap: 8px; align-items: center; margin-top: 8px;
}
.custom-amount-row.show { display: flex; }
.custom-amount-row input {
  flex: 1;
  padding: 8px 12px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--accent); background: var(--bg2);
  color: var(--text); font-size: 14px; font-weight: 700;
  font-family: var(--font-en); outline: none;
}
.custom-amount-row input:focus { box-shadow: 0 0 0 3px var(--accent-l); }
.custom-amount-row span { font-size: 13px; color: var(--text3); font-family: var(--font-en); white-space: nowrap; }

/* ─── STATUS MANAGER ─── */
.status-modal {
  background: var(--bg2); padding: 24px 26px;
  border-radius: 18px; width: 380px; max-width: 95vw;
  border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  animation: modalIn 0.22s cubic-bezier(0.34,1.2,0.64,1);
}
.status-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); margin-bottom: 7px;
  background: var(--bg3);
}
.status-swatch { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; cursor: pointer; border: 2px solid rgba(0,0,0,0.08); }
.status-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text2); }
.status-count { font-size: 11px; color: var(--text3); font-family: var(--font-en); margin-right: 2px; }
.status-del { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 4px; }
.status-del:hover { color: var(--danger); }
.new-status-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.new-status-row input[type=text] {
  flex: 1; padding: 8px 12px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 13px; font-family: var(--font-tc); outline: none;
}
.new-status-row input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-l); }
.new-status-row input[type=color] { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; background: none; padding: 3px; }

/* ─── CONFIRM ─── */
.confirm-box {
  background: var(--bg2); padding: 28px 26px;
  border-radius: 18px; width: 320px; text-align: center;
  border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  animation: modalIn 0.22s cubic-bezier(0.34,1.2,0.64,1);
}
.confirm-icon { font-size: 38px; margin-bottom: 10px; }
.confirm-box p { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }

/* ─── RWD ─── */
@media (max-width: 768px) {
  .header-date { display: none; }
  .tab-item { padding: 0 12px; font-size: 12px; }
  #main-page { flex-direction: column; overflow-y: auto; }
  .calendar-wrapper { flex: none; height: 380px; border-right: none; border-bottom: 1px solid var(--border); }
  .board-wrapper { flex: none; }
  .sales-summary { grid-template-columns: 1fr 1fr; }
  .plan-grid { grid-template-columns: 1fr; }
  .plan-btn.custom-btn { grid-column: auto; }
}
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <h2>Lily · <span>戰情室</span></h2>
  </div>
  <div class="header-date" id="headerDate"></div>
</header>

<div class="nav-tabs">
  <div class="tab-item active" onclick="switchPage('main-page',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    看板與行事曆
  </div>
  <div class="tab-item" onclick="switchPage('list-page',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>
    清單管理
  </div>
  <div class="tab-item" onclick="switchPage('sales-page',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    業績管理
  </div>
</div>

<!-- ─── 看板 + 行事曆 ─── -->
<div id="main-page" class="page-content active">
  <div class="calendar-wrapper"><div id="calendar"></div></div>
  <div class="board-wrapper">
    <div class="board-header">
      <h3>KANBAN BOARD</h3>
      <button class="btn btn-ghost btn-sm" onclick="openStatusManager()">⚙ 管理狀態</button>
    </div>
    <div class="board-columns" id="board"></div>
  </div>
</div>

<!-- ─── 清單 ─── -->
<div id="list-page" class="page-content list-page">
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="listSearch" placeholder="搜尋學員姓名..." oninput="renderList()">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-success btn-sm" onclick="exportExcel()">↓ 匯出 Excel</button>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ 新增學員</button>
    </div>
  </div>
  <div class="table-wrap">
    <table class="excel-table">
      <thead>
        <tr>
          <th style="width:100px">姓名</th>
          <th style="width:155px">預約時間</th>
          <th style="width:130px">聯絡事項</th>
          <th style="width:95px">狀態</th>
          <th>備註</th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>
</div>

<!-- ─── 業績 ─── -->
<div id="sales-page" class="page-content sales-page">
  <div class="sales-summary">
    <div class="stat-card">
      <div class="label">本月目標業績</div>
      <div style="display:flex;align-items:baseline;gap:4px">
        <span style="font-size:13px;color:var(--text3);font-family:var(--font-en)">NT$</span>
        <input type="number" id="monthlyGoal" value="300000" onchange="updateSalesUI()"
          style="border:none;font-size:26px;font-weight:700;width:170px;outline:none;background:transparent;color:var(--text);font-family:var(--font-en)">
      </div>
    </div>
    <div class="stat-card">
      <div class="label">目前累積業績</div>
      <div class="value" id="currentSales">NT$ 0</div>
      <div class="progress-container"><div class="progress-bar" id="salesProgress" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="label">目標達成率</div>
      <div class="value" id="achievementRate" style="color:var(--accent)">0%</div>
      <div class="sub" id="dealCount">成交人數：0 人</div>
    </div>
  </div>
  <div class="sales-detail-card">
    <h3>
      本月成交明細
      <button class="btn btn-ghost btn-sm" onclick="exportSalesExcel()">↓ 匯出明細</button>
    </h3>
    <div style="overflow:auto">
      <table class="excel-table">
        <thead><tr><th>日期</th><th>姓名</th><th>購買方案</th><th>金額</th></tr></thead>
        <tbody id="sales-detail-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ─── 右鍵選單 ─── -->
<div id="contextMenu" class="context-menu"></div>

<!-- ─── Overlay ─── -->
<div id="overlay" class="overlay" onclick="handleOverlayClick(event)">

  <!-- 學員 Modal -->
  <div id="modal" class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">
      <span id="modalTitle">新增學員</span>
      <span class="accent-chip" id="modalChip">NEW</span>
    </div>

    <div class="form-group"><label>姓名</label><input id="mName" placeholder="請輸入學員姓名"></div>

    <div class="form-group">
      <label>日期與時間</label>
      <div class="form-row">
        <input type="date" id="mDate">
        <select id="mHour"></select>
        <select id="mMin"><option>00</option><option>30</option></select>
      </div>
    </div>

    <div class="form-group"><label>狀態</label><select id="mStatus" onchange="onStatusChange()"></select></div>

    <!-- 成交方案區塊 -->
    <div id="planSection" style="display:none">
      <div class="plan-label">💎 選擇課程方案</div>

      <!-- 固定方案格子 -->
      <div class="plan-grid" id="planGrid">
        <button class="plan-btn" onclick="selectPlan('輕鬆學',68400,this)">
          <span class="plan-name">輕鬆學</span>
          <span class="plan-price">NT$68,400</span>
        </button>
        <button class="plan-btn" onclick="selectPlan('進階學',92400,this)">
          <span class="plan-name">進階學</span>
          <span class="plan-price">NT$92,400</span>
        </button>
        <button class="plan-btn" onclick="selectPlan('小夢想家',116400,this)">
          <span class="plan-name">小夢想家</span>
          <span class="plan-price">NT$116,400</span>
        </button>
        <button class="plan-btn" onclick="selectPlan('大夢想家',140400,this)">
          <span class="plan-name">大夢想家</span>
          <span class="plan-price">NT$140,400</span>
        </button>
        <!-- 自訂課程 -->
        <button class="plan-btn custom-btn" id="customPlanBtn" onclick="selectCustomPlan(this)">
          <span class="plan-name">✏️ 自訂課程</span>
          <span class="plan-price">自行輸入課程名稱與金額</span>
        </button>
      </div>

      <!-- 自訂課程輸入行 -->
      <div id="customRow" style="display:none;flex-direction:column;gap:8px;margin-top:4px">
        <input type="text" id="customPlanName" placeholder="課程名稱（例：補充課程）"
          style="padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--accent);background:var(--bg2);color:var(--text);font-size:13px;font-family:var(--font-tc);outline:none;">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;color:var(--text3);font-family:var(--font-en);white-space:nowrap">NT$</span>
          <input type="number" id="customPlanAmount" placeholder="0"
            style="flex:1;padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--accent);background:var(--bg2);color:var(--text);font-size:14px;font-weight:700;font-family:var(--font-en);outline:none;">
        </div>
      </div>
    </div>

    <div class="form-group"><label>聯絡事項</label><input id="mContact" placeholder="下次聯絡提醒..."></div>
    <div class="form-group"><label>私房備註</label><textarea id="mNote" rows="2" placeholder="個人備忘..."></textarea></div>

    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn btn-primary" onclick="saveData()" style="flex:1.5">儲存</button>
      <button class="btn btn-ghost" onclick="closeOverlay()" style="flex:1">取消</button>
    </div>
  </div>

  <!-- 狀態管理 Modal -->
  <div id="statusModal" class="status-modal" onclick="event.stopPropagation()" style="display:none">
    <div class="modal-title">管理看板狀態</div>
    <div id="statusList"></div>
    <div class="new-status-row">
      <input type="color" id="newStatusColor" value="#54a0ff">
      <input type="text" id="newStatusName" placeholder="輸入新狀態名稱..." onkeydown="if(event.key==='Enter')addStatus()">
      <button class="btn btn-primary btn-sm" onclick="addStatus()">新增</button>
    </div>
    <div style="margin-top:16px;display:flex;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="closeOverlay()">完成</button>
    </div>
  </div>

  <!-- 刪除確認 -->
  <div id="confirmBox" class="confirm-box" onclick="event.stopPropagation()" style="display:none">
    <div class="confirm-icon">🗑️</div>
    <p id="confirmMsg">確定要移除這位學員嗎？</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-danger" onclick="confirmDelete()" style="flex:1">確定刪除</button>
      <button class="btn btn-ghost" onclick="closeOverlay()" style="flex:1">取消</button>
    </div>
  </div>

</div>

<script>
/* ════════ 資料 ════════ */
let data     = JSON.parse(localStorage.getItem("lily_crm_vFinal"))        || [];
let statuses = JSON.parse(localStorage.getItem("lily_crm_status_vFinal")) || [
  {name:"已邀約",color:"#54a0ff"},{name:"未DEMO",color:"#ff9f43"},
  {name:"已DEMO",color:"#1dd1a1"},{name:"成交",color:"#a29bfe"},{name:"取消",color:"#ee5253"}
];

/* 固定方案金額對照（不含自訂） */
const FIXED_PLANS = {輕鬆學:68400, 進階學:92400, 小夢想家:116400, 大夢想家:140400};

/* 取得一筆紀錄的金額（固定方案 or 自訂） */
function getPlanAmount(item) {
  if (!item.plan) return 0;
  if (item.customAmount) return parseInt(item.customAmount) || 0;
  return FIXED_PLANS[item.plan] || 0;
}

let currentEditId=null, pendingDeleteId=null, draggedId=null;
let selectedPlanName=null, selectedPlanAmount=null, isCustomPlan=false;
let calendarInstance=null;

/* 小時選項 */
const hSel=document.getElementById('mHour');
for(let i=0;i<24;i++){const v=String(i).padStart(2,'0');hSel.innerHTML+=`<option value="${v}">${v}</option>`;}

/* 日期 */
const DAYS=['日','一','二','三','四','五','六'], _n=new Date();
document.getElementById('headerDate').textContent=
  `${_n.getFullYear()}/${String(_n.getMonth()+1).padStart(2,'0')}/${String(_n.getDate()).padStart(2,'0')} 星期${DAYS[_n.getDay()]}`;

function persist(){
  localStorage.setItem("lily_crm_vFinal",JSON.stringify(data));
  localStorage.setItem("lily_crm_status_vFinal",JSON.stringify(statuses));
  localStorage.setItem("lily_goal",document.getElementById('monthlyGoal').value);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ════════ 頁面切換 ════════ */
function switchPage(pageId,el){
  document.querySelectorAll('.page-content,.tab-item').forEach(x=>x.classList.remove('active'));
  document.getElementById(pageId).classList.add('active'); el.classList.add('active');
  if(pageId==='main-page'){ if(calendarInstance){calendarInstance.render();refreshCal();}else initCal(); renderBoard(); }
  else if(pageId==='list-page') renderList();
  else if(pageId==='sales-page') updateSalesUI();
}

/* ════════ Calendar ════════ */
function calEvents(){
  return data.map(x=>({
    id:x.id.toString(), title:x.name, start:x.time,
    backgroundColor:(statuses.find(s=>s.name===x.status)||{}).color||'#0ea5e9',
    borderColor:'transparent', textColor:'#fff'
  }));
}
function refreshCal(){ if(!calendarInstance)return; calendarInstance.getEventSources().forEach(s=>s.remove()); calendarInstance.addEventSource(calEvents()); }
function initCal(){
  calendarInstance=new FullCalendar.Calendar(document.getElementById('calendar'),{
    initialView:'dayGridMonth', locale:'zh-tw', expandRows:true, editable:true,
    eventTimeFormat:{hour:'2-digit',minute:'2-digit',hour12:false},
    events:calEvents(),
    dateClick:info=>openModal(null,info.dateStr),
    eventClick:info=>openModal(info.event.id),
    eventDrop:info=>{
      const item=data.find(x=>x.id==info.event.id);
      if(item){const d=info.event.start,pad=n=>String(n).padStart(2,'0'),t=item.time.split('T')[1]||'09:00';
        item.time=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${t}`;
        persist(); renderBoard(); updateSalesUI();}
    },
    eventDidMount:info=>{info.el.oncontextmenu=e=>showCtxMenu(e,info.event.id);}
  });
  calendarInstance.render();
}

/* ════════ 看板 ════════ */
function renderBoard(){
  const board=document.getElementById('board'); board.innerHTML='';
  statuses.forEach(s=>{
    const cnt=data.filter(x=>x.status===s.name).length;
    const col=document.createElement('div'); col.className='column';
    col.innerHTML=`<div class="column-header" style="background:${s.color}14">
      <div class="col-title"><div class="col-dot" style="background:${s.color}"></div>${esc(s.name)}</div>
      <span class="col-count">${cnt}</span></div><div class="list-area"></div>`;
    col.ondragover=e=>e.preventDefault();
    col.ondrop=()=>{const item=data.find(x=>x.id==draggedId);if(item){item.status=s.name;persist();refreshCal();renderBoard();updateSalesUI();}};
    const area=col.querySelector('.list-area');
    data.filter(x=>x.status===s.name).sort((a,b)=>new Date(a.time)-new Date(b.time)).forEach(item=>{
      const d=new Date(item.time);
      const enDate=d.toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short'});
      const timePart=item.time.split('T')[1]||'';
      const card=document.createElement('div'); card.className='card'; card.draggable=true;
      card.style.borderLeftColor=s.color;
      const planLabel=item.plan?(item.customAmount?`✏️ ${item.plan}`:`💎 ${item.plan}`):'';
      card.innerHTML=`<div class="card-name">${esc(item.name)}</div>
        <span class="card-time">${enDate} · ${timePart}</span>
        ${planLabel?`<span class="card-plan">${esc(planLabel)}</span>`:''}`;
      card.onclick=()=>openModal(item.id);
      card.oncontextmenu=e=>showCtxMenu(e,item.id);
      card.ondragstart=()=>{draggedId=item.id;};
      area.appendChild(card);
    });
    board.appendChild(col);
  });
}

/* ════════ 清單 ════════ */
function renderList(){
  const kw=document.getElementById('listSearch').value.toLowerCase();
  document.getElementById('list-body').innerHTML=
    data.filter(x=>x.name.toLowerCase().includes(kw))
      .sort((a,b)=>new Date(b.time)-new Date(a.time))
      .map(item=>{
        const c=(statuses.find(s=>s.name===item.status)||{}).color||'#999';
        return `<tr onclick="openModal(${item.id})" oncontextmenu="showCtxMenu(event,${item.id})">
          <td><b style="color:var(--text)">${esc(item.name)}</b></td>
          <td style="font-family:var(--font-en)">${esc(item.time.replace('T',' '))}</td>
          <td>${esc(item.contact||'—')}</td>
          <td><span class="status-pill" style="color:${c};background:${c}18;border:1px solid ${c}44">${esc(item.status)}</span></td>
          <td style="color:var(--text3)">${esc(item.note||'')}</td>
        </tr>`;
      }).join('');
}

/* ════════ 業績 ════════ */
function updateSalesUI(){
  const goal=parseFloat(document.getElementById('monthlyGoal').value)||1;
  const n=new Date();
  const deals=data.filter(x=>{const d=new Date(x.time);return x.status==='成交'&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();});
  const total=deals.reduce((s,x)=>s+getPlanAmount(x),0);
  const rate=Math.round((total/goal)*100);
  document.getElementById('currentSales').textContent=`NT$ ${total.toLocaleString()}`;
  document.getElementById('achievementRate').textContent=`${rate}%`;
  document.getElementById('salesProgress').style.width=`${Math.min(rate,100)}%`;
  document.getElementById('dealCount').textContent=`成交人數：${deals.length} 人`;
  document.getElementById('sales-detail-body').innerHTML=
    deals.sort((a,b)=>new Date(b.time)-new Date(a.time)).map(x=>{
      const amt=getPlanAmount(x);
      const planLabel=x.customAmount?`✏️ ${x.plan||'自訂'}`:x.plan||'未設定';
      return `<tr>
        <td style="font-family:var(--font-en)">${esc(x.time.split('T')[0])}</td>
        <td>${esc(x.name)}</td>
        <td style="color:var(--gold)">${esc(planLabel)}</td>
        <td style="font-family:var(--font-en);color:var(--success)">NT$ ${amt.toLocaleString()}</td>
      </tr>`;
    }).join('');
  persist();
}

/* ════════ 匯出 ════════ */
function exportExcel(){
  const ws=XLSX.utils.json_to_sheet(data.map(x=>({'姓名':x.name,'預約時間':x.time.replace('T',' '),'狀態':x.status,'方案':x.plan||'','金額':getPlanAmount(x)||'','聯絡事項':x.contact||'','備註':x.note||''})));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'學員清單');
  XLSX.writeFile(wb,`Lily學員清單_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')}.xlsx`);
}
function exportSalesExcel(){
  const n=new Date();
  const deals=data.filter(x=>{const d=new Date(x.time);return x.status==='成交'&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();});
  const rows=deals.map(x=>({'日期':x.time.split('T')[0],'姓名':x.name,'購買方案':x.plan||'未設定','金額':getPlanAmount(x)}));
  rows.push({'日期':'','姓名':'合計','購買方案':'','金額':rows.reduce((s,r)=>s+r['金額'],0)});
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'本月成交');
  XLSX.writeFile(wb,`Lily業績明細_${n.getFullYear()}-${n.getMonth()+1}.xlsx`);
}

/* ════════ 右鍵選單 ════════ */
function showCtxMenu(e,id){
  e.preventDefault();
  const menu=document.getElementById('contextMenu');
  menu.innerHTML=`<div onclick="openModal(${id});closeCtx()">✏️ 修改資料</div><hr>
    <div class="danger" onclick="askDelete(${id});closeCtx()">🗑️ 移除學員</div>`;
  menu.style.display='block';
  menu.style.left=Math.min(e.clientX,innerWidth-160)+'px';
  menu.style.top=Math.min(e.clientY,innerHeight-90)+'px';
}
function closeCtx(){document.getElementById('contextMenu').style.display='none';}
document.addEventListener('click',closeCtx);

/* ════════ Overlay ════════ */
function openOverlay(which){
  ['modal','statusModal','confirmBox'].forEach(id=>document.getElementById(id).style.display=(id===which)?'block':'none');
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){document.getElementById('overlay').classList.remove('show');pendingDeleteId=null;}
function handleOverlayClick(e){if(e.target===document.getElementById('overlay'))closeOverlay();}

/* ════════ 方案選擇邏輯 ════════ */
function clearPlanSelection(){
  document.querySelectorAll('.plan-btn').forEach(b=>b.classList.remove('selected'));
  selectedPlanName=null; selectedPlanAmount=null; isCustomPlan=false;
  document.getElementById('customRow').style.display='none';
  document.getElementById('customPlanName').value='';
  document.getElementById('customPlanAmount').value='';
}
function selectPlan(name,amount,btn){
  clearPlanSelection(); btn.classList.add('selected');
  selectedPlanName=name; selectedPlanAmount=amount; isCustomPlan=false;
}
function selectCustomPlan(btn){
  clearPlanSelection(); btn.classList.add('selected');
  isCustomPlan=true; selectedPlanName=null;
  document.getElementById('customRow').style.display='flex';
  document.getElementById('customPlanName').focus();
}
function onStatusChange(){
  const s=document.getElementById('mStatus').value;
  document.getElementById('planSection').style.display=(s==='成交')?'block':'none';
}

/* ════════ 學員 Modal ════════ */
function openModal(id=null,defaultDate=null){
  currentEditId=id?parseInt(id):null;
  document.getElementById('modalTitle').textContent=currentEditId?'編輯學員':'新增學員';
  document.getElementById('modalChip').textContent=currentEditId?'EDIT':'NEW';

  const sel=document.getElementById('mStatus');
  sel.innerHTML=statuses.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');

  const item=data.find(x=>x.id==currentEditId);
  document.getElementById('mName').value=item?item.name:'';
  document.getElementById('mStatus').value=item?item.status:statuses[0].name;
  document.getElementById('mContact').value=item?(item.contact||''):'';
  document.getElementById('mNote').value=item?(item.note||''):'';

  if(item){
    const[d,t]=item.time.split('T');
    document.getElementById('mDate').value=d;
    document.getElementById('mHour').value=t?t.split(':')[0]:'09';
    document.getElementById('mMin').value=t?t.split(':')[1]:'00';
  } else {
    document.getElementById('mDate').value=defaultDate||new Date().toISOString().split('T')[0];
    document.getElementById('mHour').value='09'; document.getElementById('mMin').value='00';
  }

  /* 恢復方案選擇 */
  clearPlanSelection();
  onStatusChange();
  if(item && item.status==='成交' && item.plan){
    if(item.customAmount){
      /* 自訂方案 */
      selectCustomPlan(document.getElementById('customPlanBtn'));
      document.getElementById('customPlanName').value=item.plan;
      document.getElementById('customPlanAmount').value=item.customAmount;
    } else {
      /* 固定方案 */
      document.querySelectorAll('.plan-btn:not(.custom-btn)').forEach(btn=>{
        if(btn.querySelector('.plan-name').textContent===item.plan) selectPlan(item.plan, FIXED_PLANS[item.plan], btn);
      });
    }
  }
  openOverlay('modal');
}

function saveData(){
  const name=document.getElementById('mName').value.trim();
  if(!name){alert('請輸入姓名');return;}
  const status=document.getElementById('mStatus').value;

  let planName=null, customAmount=null;
  if(status==='成交'){
    if(isCustomPlan){
      planName=document.getElementById('customPlanName').value.trim()||'自訂課程';
      const amt=parseInt(document.getElementById('customPlanAmount').value)||0;
      if(amt<=0){alert('請輸入有效金額');return;}
      customAmount=amt;
    } else {
      if(!selectedPlanName){alert('請選擇課程方案');return;}
      planName=selectedPlanName;
    }
  }

  const item={
    id: currentEditId||Date.now(), name, status,
    plan: planName,
    customAmount: customAmount,
    time:`${document.getElementById('mDate').value}T${document.getElementById('mHour').value}:${document.getElementById('mMin').value}`,
    contact:document.getElementById('mContact').value,
    note:document.getElementById('mNote').value
  };
  if(currentEditId) data[data.findIndex(x=>x.id==currentEditId)]=item; else data.push(item);
  persist(); closeOverlay(); refreshCal(); renderBoard(); renderList(); updateSalesUI();
}

/* ════════ 刪除 ════════ */
function askDelete(id){
  pendingDeleteId=id;
  const item=data.find(x=>x.id==id);
  document.getElementById('confirmMsg').textContent=`確定要移除「${item?item.name:'此學員'}」嗎？此操作無法復原。`;
  openOverlay('confirmBox');
}
function confirmDelete(){
  if(pendingDeleteId!=null){data=data.filter(x=>x.id!=pendingDeleteId);persist();closeOverlay();refreshCal();renderBoard();renderList();updateSalesUI();pendingDeleteId=null;}
}
function deleteItem(id){askDelete(id);}

/* ════════ 狀態管理 ════════ */
function openStatusManager(){ renderStatusList(); openOverlay('statusModal'); }
function renderStatusList(){
  document.getElementById('statusList').innerHTML=statuses.map((s,i)=>`
    <div class="status-item">
      <div class="status-swatch" style="background:${s.color}" onclick="pickColor(${i},this)"></div>
      <span class="status-name">${esc(s.name)}</span>
      <span class="status-count">${data.filter(x=>x.status===s.name).length} 人</span>
      <button class="status-del" onclick="removeStatus(${i})">×</button>
    </div>`).join('');
}
function addStatus(){
  const name=document.getElementById('newStatusName').value.trim();
  const color=document.getElementById('newStatusColor').value;
  if(!name) return;
  if(statuses.find(s=>s.name===name)){alert('此狀態已存在');return;}
  statuses.push({name,color}); document.getElementById('newStatusName').value='';
  persist(); renderStatusList(); renderBoard();
}
function removeStatus(i){
  const s=statuses[i];
  if(data.some(x=>x.status===s.name)){
    if(!confirm(`「${s.name}」有 ${data.filter(x=>x.status===s.name).length} 位學員，確定刪除狀態？`))return;
    data.filter(x=>x.status===s.name).forEach(x=>x.status='');
  }
  statuses.splice(i,1); persist(); renderStatusList(); renderBoard(); refreshCal();
}
function pickColor(i,el){
  const inp=document.createElement('input'); inp.type='color'; inp.value=statuses[i].color;
  inp.oninput=e=>{statuses[i].color=e.target.value;el.style.background=e.target.value;};
  inp.onchange=()=>{persist();renderBoard();refreshCal();}; inp.click();
}

/* ════════ 初始化 ════════ */
document.getElementById('monthlyGoal').value=localStorage.getItem('lily_goal')||300000;
initCal(); renderBoard();
</script>
